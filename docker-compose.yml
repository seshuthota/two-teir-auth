services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: user-auth-oracle
    environment:
      ORACLE_PASSWORD: systempass
      APP_USER: authuser
      APP_USER_PASSWORD: authpass
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: user-auth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  l1-shipment:
    image: eclipse-temurin:21-jre-alpine
    container_name: user-auth-shipment
    ports:
      - "8082:8082"
    command: >
      sh -c "apk add --no-cache curl && sleep 15 && java -jar /app/app.jar"
    volumes:
      - ./l1-shipment-service/target/l1-shipment-service-1.0.0.jar:/app/app.jar
    environment:
      - L2_BASE_URL=http://l2-app-1:8081
    depends_on:
      redis:
        condition: service_healthy

volumes:
  oracle-data:
