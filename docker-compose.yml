services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: user-auth-oracle
    environment:
      ORACLE_PASSWORD: systempass
      APP_USER: authuser
      APP_USER_PASSWORD: authpass
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: user-auth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  oracle-data:
